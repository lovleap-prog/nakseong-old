<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>움직이는 초등 과학 수업</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 첫 화면: 위에 학생 참여 칸, 아래에 단원 목록 */
:root {
  color-scheme: light;
  --sky: #e6f1f9; --paper: #fbfdfe; --ink: #14273d; --ink-2: #47596e; --line: #c4d4e1; --sun: #f08c00; --sun-soft: #ffe8b5; --hot: #dc3f2a;
  --f-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--sky); color: var(--ink); font: 400 18px/1.6 var(--f-body); word-break: keep-all; }
.wrap { max-width: 880px; margin: 0 auto; padding-block: 36px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: clamp(34px, 6vw, 54px); }
h2 { font-size: 26px; }
h3 { font-size: 24px; }
p { margin: 0; }
.lead { color: var(--ink-2); }
.join { background: var(--paper); border: 2px solid var(--ink); border-radius: 16px; padding: 20px; display: grid; gap: 12px; }
.join form { display: flex; flex-wrap: wrap; gap: 10px; }
.join input { flex: 1; min-width: 0; min-height: 60px; padding: 0 16px; border: 2px solid var(--ink); border-radius: 12px; background: var(--paper); color: var(--ink); font: 400 32px/1 var(--f-display); letter-spacing: .2em; font-variant-numeric: tabular-nums; }
.join button { min-height: 60px; padding: 0 28px; border: 2px solid var(--ink); border-radius: 12px; background: var(--sun); color: var(--ink); font: 700 20px/1 var(--f-body); cursor: pointer; }
.join .msg { min-height: 1.6em; font-weight: 700; color: var(--hot); }
:focus-visible { outline: 3px solid #2a6bd1; outline-offset: 2px; }
.units { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.units a { display: grid; gap: 2px; padding: 16px 20px; background: var(--paper); border-radius: 14px; border-left: 8px solid var(--sun); color: inherit; text-decoration: none; }
.units a:hover { background: var(--sun-soft); }
.units small { color: var(--ink-2); font-size: 15px; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>움직이는 초등 과학 수업</h1>
    <p class="lead">교과서의 탐구를 손으로 움직여 보며 배워요.</p>
  </header>

  <section class="join" id="join" hidden>
    <h2>수업 참여하기</h2>
    <p>선생님 화면에 보이는 참여 코드 여섯 자리를 넣어요.</p>
    <form id="joinForm">
      <input id="joinCode" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000" aria-label="참여 코드 여섯 자리">
      <button type="submit">들어가기</button>
    </form>
    <p class="msg" id="joinMsg" aria-live="polite"></p>
  </section>

  <section>
    <h2>수업 자료</h2>
    <ul class="units">
      <li><a href="season/"><small>6학년 2학기 과학 1단원</small><h3>계절의 변화</h3><span>태양 고도와 그림자, 계절별 남중 고도, 지구의 공전</span></a></li>
      <li><a href="electric/"><small>6학년 2학기 과학 3단원</small><h3>전기의 이용</h3><span>전기 회로, 전지의 직렬연결, 전자석</span></a></li>
    </ul>
  </section>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="room.js"></script>
<script>
(function () {
  'use strict';
  if (!window.LessonRoom) return;                       // 수업방이 연결되지 않았으면 참여 칸을 숨긴 채로 둔다
  var form = document.getElementById('joinForm'), input = document.getElementById('joinCode'), msg = document.getElementById('joinMsg');
  document.getElementById('join').hidden = false;
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = input.value.replace(/\D/g, '');
    if (code.length !== 6) { msg.textContent = '숫자 여섯 자리를 넣어 주세요.'; return; }
    msg.textContent = '찾는 중…';
    window.LessonRoom.find(code).then(function (room) {
      if (!room || !/^[a-z]+$/.test(room.lesson)) { msg.textContent = '그런 수업방이 없어요. 코드를 다시 확인해요.'; return; }
      window.location.href = room.lesson + '/?room=' + code;
    }).catch(function () { msg.textContent = '연결하지 못했어요. 잠시 뒤 다시 해 봐요.'; });
  });
})();
</script>
</body>
</html>
